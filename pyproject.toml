[project]
name = "orama"
version = "0.1.0"
description = "Orama Server: control app that deploys a Docker Compose media stack"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6",
    "cryptography>=43",
    "flask==3.1.3",
    "waitress==3.0.2",
    "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orama", "src/orama_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: slow tests that need Docker or a VM (deselect with -m 'not integration')",
    "e2e: full end-to-end proof against clean Ubuntu or a Debian VM (runs under ORAMA_E2E_TARGET)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
