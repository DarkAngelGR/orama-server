name: CI

on:
  push:
  pull_request:

# Least privilege: jobs that need more say so themselves.
permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm test

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uv run ruff check
      - name: Unit tests
        run: uv run pytest -m "not integration"
      - name: Shellcheck
        run: if [ -f install.sh ]; then shellcheck install.sh; fi

  images:
    # Builds both images; on main it pushes only the immutable sha-<short> tag.
    # The <version> tag users install is moved by `publish`, after integration is green.
    needs: unit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.tags.outputs.version }}
      sha: ${{ steps.tags.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Image tags
        id: tags
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Orama image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/orama.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/darkangelgr/orama:${{ steps.tags.outputs.sha }}
      - name: Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/darkangelgr/orama-agent:${{ steps.tags.outputs.sha }}

  browser:
    # Real Chromium drives the whole web app (tests/web/test_browser.py), with fakes for the
    # Agent, Prowlarr, SABnzbd, Plex and the apply child. A separate job on purpose: a browser
    # install hiccup must be visible without hiding the unit results.
    # `publish` does NOT need this job yet. Make it a requirement once it has been green on
    # three pushes in a row, so a flaky browser install cannot block the version tag.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_VERSION: "1.63.0"
      PLAYWRIGHT_DIR: ${{ github.workspace }}/.playwright-node
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright and Chromium (pinned)
        run: |
          npm install --prefix "$PLAYWRIGHT_DIR" --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          "$PLAYWRIGHT_DIR/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test dependencies
        run: uv sync --frozen
      - name: Real-browser tests
        # NODE_PATH lets the test's node scripts find the pinned playwright package.
        run: NODE_PATH="$PLAYWRIGHT_DIR/node_modules" uv run pytest tests/web/test_browser.py -m integration -v -p no:cacheprovider

  integration:
    # Plan 1 on a real Docker host: install twice, deploy the apps, nothing leaks.
    needs: [unit, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Test dependencies
        run: uv sync --frozen
      - name: Dedicated install user
        run: |
          sudo useradd --no-create-home --user-group --shell /usr/sbin/nologin orama-it
          echo "ORAMA_TEST_PUID=$(id -u orama-it)" >> "$GITHUB_ENV"
          echo "ORAMA_TEST_PGID=$(id -g orama-it)" >> "$GITHUB_ENV"
      - name: Integration test
        # As root; the venv's python keeps uv's cache out of root's hands.
        run: >-
          sudo -E env "PATH=$PATH" ORAMA_INTEGRATION=1
          ORAMA_IT_LOG_DIR="$GITHUB_WORKSPACE/integration-logs"
          .venv/bin/python -m pytest -m integration -v -p no:cacheprovider
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: integration-logs/
          if-no-files-found: ignore

  publish:
    # A red commit must never publish: <version> is the tag users install.
    needs: [unit, images, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point the version tags at this commit's images
        env:
          VERSION: ${{ needs.images.outputs.version }}
          SHA: ${{ needs.images.outputs.sha }}
        run: |
          for image in orama orama-agent; do
            docker buildx imagetools create \
              -t "ghcr.io/darkangelgr/$image:$VERSION" "ghcr.io/darkangelgr/$image:$SHA"
          done
