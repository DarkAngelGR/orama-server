name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uv run ruff check
      - name: Unit tests
        run: uv run pytest -m "not integration"
      - name: Shellcheck
        run: if [ -f install.sh ]; then shellcheck install.sh; fi

  images:
    # A red commit must never publish: <version> is the tag users install.
    needs: unit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image tags
        id: tags
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Orama image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/orama.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/darkangelgr/orama:${{ steps.tags.outputs.version }}
            ghcr.io/darkangelgr/orama:${{ steps.tags.outputs.sha }}
      - name: Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/darkangelgr/orama-agent:${{ steps.tags.outputs.version }}
            ghcr.io/darkangelgr/orama-agent:${{ steps.tags.outputs.sha }}

  integration:
    # Plan 1 on a real Docker host: install twice, deploy the apps, nothing leaks.
    needs: [unit, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test dependencies
        run: uv sync --frozen
      - name: Dedicated install user
        run: |
          sudo useradd --no-create-home --user-group --shell /usr/sbin/nologin orama-it
          echo "ORAMA_TEST_PUID=$(id -u orama-it)" >> "$GITHUB_ENV"
          echo "ORAMA_TEST_PGID=$(id -g orama-it)" >> "$GITHUB_ENV"
      - name: Integration test
        # As root; the venv's python keeps uv's cache out of root's hands.
        run: >-
          sudo -E env "PATH=$PATH" ORAMA_INTEGRATION=1
          ORAMA_IT_LOG_DIR="$GITHUB_WORKSPACE/integration-logs"
          .venv/bin/python -m pytest -m integration -v -p no:cacheprovider
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: integration-logs/
          if-no-files-found: ignore
