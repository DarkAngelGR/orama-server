name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uv run ruff check
      - name: Unit tests
        run: uv run pytest -m "not integration"
      - name: Shellcheck
        run: if [ -f install.sh ]; then shellcheck install.sh; fi

  images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image tags
        id: tags
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Orama image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/orama.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/darkangelgr/orama:${{ steps.tags.outputs.version }}
            ghcr.io/darkangelgr/orama:${{ steps.tags.outputs.sha }}
      - name: Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/darkangelgr/orama-agent:${{ steps.tags.outputs.version }}
            ghcr.io/darkangelgr/orama-agent:${{ steps.tags.outputs.sha }}
