name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uv run ruff check
      - name: Unit tests
        run: uv run pytest -m "not integration"
      - name: Shellcheck
        run: if [ -f install.sh ]; then shellcheck install.sh; fi
